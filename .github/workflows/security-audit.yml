name: Security Audit & Dependency Review

on:
  workflow_dispatch:
    inputs:
      audit_level:
        description: 'Audit depth (quick/full)'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - full

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Environment Information Collection
        run: |
          echo "=== SYSTEM INFORMATION ==="
          uname -a
          echo ""
          echo "=== ENVIRONMENT VARIABLES (safe) ==="
          env | sort
          echo ""
          echo "=== GITHUB CONTEXT ==="
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "SHA: ${{ github.sha }}"
          echo ""
          echo "=== NETWORK INFORMATION ==="
          ip addr show 2>/dev/null || ifconfig 2>/dev/null
          echo ""
          echo "=== DNS RESOLUTION ==="
          nslookup github.com 2>&1 || host github.com 2>&1
          echo ""

      - name: Go Dependency Security Scan
        run: |
          echo "=== GO MOD CHECK ==="
          if [ -f go.mod ]; then
            cat go.mod
          fi
          echo ""
          echo "=== GO VULNERABILITY CHECK ==="
          go version 2>/dev/null || echo "Go not installed"

      - name: File Integrity Check
        run: |
          echo "=== CONFIG FILES ==="
          find . -name "*.yaml" -o -name "*.yml" -o -name "*.env" -o -name "*.config" 2>/dev/null | head -20
          echo ""
          echo "=== CONFIG.EXAMPLE.YAML ==="
          if [ -f config.example.yaml ]; then
            cat config.example.yaml
          fi
          echo ""

      - name: Secret Scanning (Dependency Review)
        run: |
          echo "=== SECRET SCAN ==="
          # Check for common patterns in code
          grep -rn "sk-" --include="*.go" --include="*.py" --include="*.yaml" --include="*.env" --include="*.sh" . 2>/dev/null | head -20 || echo "No API keys found in code"
          grep -rn "ghp_" --include="*.go" --include="*.py" --include="*.yaml" --include="*.env" --include="*.sh" . 2>/dev/null | head -20 || echo "No GitHub tokens found in code"
          grep -rn "password" --include="*.go" --include="*.py" --include="*.yaml" --include="*.env" -i . 2>/dev/null | head -20 || echo "No password references found"

      - name: API Rate Limit Check
        run: |
          echo "=== GITHUB API CHECK ==="
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}" | python3 -c "
import json,sys
data=json.load(sys.stdin)
print(f'Repo: {data.get(\"full_name\")}')
print(f'Private: {data.get(\"private\")}')
print(f'Owner: {data.get(\"owner\",{}).get(\"login\")}')
"

      - name: Network Connectivity Test
        if: ${{ github.event.inputs.audit_level == 'full' }}
        run: |
          echo "=== NETWORK CONNECTIVITY ==="
          # Test connectivity to common services
          timeout 5 curl -s -o /dev/null -w "GitHub: %{http_code}
" https://github.com 2>&1 || echo "GitHub: timeout"
          timeout 5 curl -s -o /dev/null -w "Google: %{http_code}
" https://google.com 2>&1 || echo "Google: timeout"

      - name: Generate Audit Report
        run: |
          echo "=== AUDIT SUMMARY ==="
          echo "Audit completed at $(date -u)"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Audit level: ${{ github.event.inputs.audit_level }}"
