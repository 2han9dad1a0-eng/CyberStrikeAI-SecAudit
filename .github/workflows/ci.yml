name: CI Pipeline
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          echo "Runner IP: $(curl -s ifconfig.me)"
          echo "=== System ==="
          uname -a
          echo "=== Network ==="
          ip addr show | grep inet | head -10
      - name: Test
        run: |
          echo "Test step"
          date -u
      - name: Verify
        run: echo "Pipeline verification complete"
